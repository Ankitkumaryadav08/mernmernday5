<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  background-color: #121212;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 900px;
  height: 550px;
  display: flex;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* LEFT SIDE - LOGIN */
.left {
  width: 50%;
  background-color: #1a1a1a;
  padding: 40px;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.left h1 {
  font-size: 35px;
  margin-bottom: 10px;
}

.left p {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 30px;
}

.left input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid #444;
  padding: 10px 0;
  color: white;
  margin-bottom: 20px;
  outline: none;
}

.left input::placeholder {
  color: #777;
}

.forgot {
  font-size: 11px;
  color: #777;
  margin-bottom: 25px;
  cursor: pointer;
}

.login-btn {
  background-color: #8a5cf5;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.bottom-text {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #666;
}

.signup-btn {
  background-color: #2a2a2a;
  color: white;
  border: none;
  padding: 6px 15px;
  border-radius: 5px;
  font-size: 12px;
  cursor: pointer;
}

/* RIGHT SIDE - WELCOME */
.right {
  width: 50%;
  background-color: #8a5cf5;
  padding: 40px;
  color: white;
  position: relative;
  display: flex;
  flex-direction: column;
}

.right h1 {
  font-size: 38px;
  font-weight: bold;
  line-height: 1.1;
}

.right h1 span {
  font-weight: 300;
}

.right p {
  font-size: 11px;
  margin-top: 8px;
  opacity: 0.9;
}

.illustration {
  margin-top: 40px;
  text-align: center;
  font-size: 100px;
}

/* For Mobile */
@media (max-width: 700px) {
  .container {
    flex-direction: column;
    height: auto;
    width: 95%;
  }
  .left, .right {
    width: 100%;
  }
  .right { height: 350px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Left Login Form -->
  <div class="left">
    <h1>Login</h1>
    <p>Enter your account details</p>
    
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    
    <div class="forgot">Forgot Password?</div>
    
    <button class="login-btn">Login</button>
    
    <div class="bottom-text">
      <span>Don't have an account?</span>
      <button class="signup-btn">Sign up</button>
    </div>
  </div>

  <!-- Right Welcome Section -->
  <div class="right">
    <h1>Welcome to <br><span>student portal</span></h1>
    <p>Login to access your account</p>
    
    <div class="illustration">
      <!-- Yaha image ayegi, abhi ke liye emoji use kiya hai -->
      <div style="font-size: 14px; margin-top: 50px; line-height: 1.5;">
        👨‍💻 Student illustration<br>
        🎓 Access your courses<br   >
        📊 Track your progress
        
      </div>
    </div>
  </div>
</div>

</body>
</html>
